name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and app build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v4

      - name: Generate project
        run: |
          tuist install
          tuist generate --no-open

      - name: Resolve simulator
        id: simulator
        run: |
          UDID=$(xcrun simctl list devices available | grep -m1 -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')
          if [ -z "$UDID" ]; then
            echo "No available simulator found"
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Test
        run: |
          xcodebuild test \
            -workspace MedReminder.xcworkspace \
            -scheme MedReminder \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build release app
        run: |
          xcodebuild build \
            -workspace MedReminder.xcworkspace \
            -scheme MedReminder \
            -configuration Release \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO
