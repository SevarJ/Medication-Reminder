name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-tests:
    name: Package tests
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        package: [Domain, DIContainer, NotificationsKit]
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Test ${{ matrix.package }}
        working-directory: Packages/${{ matrix.package }}
        run: swift test

  simulator-tests:
    name: Simulator tests and app build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Resolve simulator
        id: simulator
        run: |
          UDID=$(xcrun simctl list devices available | grep -m1 -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')
          if [ -z "$UDID" ]; then
            echo "No available simulator found"
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Test Persistence
        working-directory: Packages/Persistence
        run: xcodebuild test -scheme Persistence -destination "id=${{ steps.simulator.outputs.udid }}"

      - name: Test MedicationFeature
        working-directory: Packages/MedicationFeature
        run: xcodebuild test -scheme MedicationFeature -destination "id=${{ steps.simulator.outputs.udid }}"

      - name: Build app
        run: |
          xcodebuild build \
            -project MedReminder.xcodeproj \
            -scheme MedReminder \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO
